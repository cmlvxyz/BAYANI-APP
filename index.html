<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0b1728" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="SINAG" />
    <link rel="icon" type="image/png" href="/bayani-logo.png" />
    <script>
      (function () {
        var probe = new Image();
        probe.onerror = function () {
          var links = document.querySelectorAll('link[rel="icon"]');
          for (var i = 0; i < links.length; i++) {
            links[i].href = '/logo.svg';
            links[i].type = 'image/svg+xml';
          }
        };
        probe.src = '/bayani-logo.png';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
